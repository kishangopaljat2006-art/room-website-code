<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Rental & Booking Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="navbar">
      <h1>Digital Rental & Booking Portal</h1>
      <span>MERN Stack Project</span>
    </header>

    <main class="container">
      <section class="card">
        <h2>डिजिटल बुकिंग एवं रूम आवंटन</h2>
        <form id="bookingForm">
          <div class="form-group">
            <label for="userId">User ID:</label>
            <input id="userId" name="userId" type="number" value="1" required />
          </div>

          <div class="form-group">
            <label for="serviceId">Property / Service ID:</label>
            <input id="serviceId" name="serviceId" type="number" value="101" required />
          </div>

          <div class="form-group">
            <label for="bookingDate">Booking Date:</label>
            <input id="bookingDate" name="bookingDate" type="date" required />
          </div>

          <button type="submit" class="btn">अभी बुकिंग करें</button>
        </form>

        <div id="bookingMessage" class="alert-success hidden"></div>
      </section>

      <section id="paymentSection" class="card hidden" style="border-left: 6px solid #10b981;">
        <h2>सुरक्षित ऑनलाइन पेमेंट गेटवे</h2>
        <p>Booking ID: <strong id="bookingIdText">#0</strong></p>
        <p>भुगतान राशि: <strong id="bookingPriceText">₹0</strong></p>

        <form id="paymentForm">
          <div class="form-group">
            <label for="paymentMethod">पेमेंट का तरीका चुनें:</label>
            <select id="paymentMethod" name="paymentMethod">
              <option value="UPI">UPI (GPay / PhonePe / Paytm)</option>
              <option value="Debit Card">डेबिट / क्रेडिट कार्ड</option>
              <option value="Net Banking">नेट बैंकिंग</option>
            </select>
          </div>

          <button type="submit" class="btn success-btn">सुरक्षित ऑनलाइन भुगतान करें</button>
        </form>

        <div id="paymentMessage" class="alert-success hidden"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
